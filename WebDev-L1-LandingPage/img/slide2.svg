<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#EAF9FB"/>

  <!-- dot pattern bottom-left -->
  <g fill="#8FE1E8" opacity="0.6">
    <circle cx="40" cy="470" r="5"/><circle cx="70" cy="470" r="5"/><circle cx="100" cy="470" r="5"/><circle cx="130" cy="470" r="5"/><circle cx="160" cy="470" r="5"/><circle cx="190" cy="470" r="5"/><circle cx="220" cy="470" r="5"/><circle cx="250" cy="470" r="5"/>
    <circle cx="55" cy="445" r="5"/><circle cx="85" cy="445" r="5"/><circle cx="115" cy="445" r="5"/><circle cx="145" cy="445" r="5"/><circle cx="175" cy="445" r="5"/><circle cx="205" cy="445" r="5"/>
    <circle cx="70" cy="420" r="5"/><circle cx="100" cy="420" r="5"/><circle cx="130" cy="420" r="5"/><circle cx="160" cy="420" r="5"/>
  </g>

  <!-- headline -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#0E2A2D">Delivery of online orders</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#0E2A2D">and corporate packages from</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#1FB8C4">Turkey, USA &amp; Germany</text>

  <!-- plane -->
  <g transform="translate(560,120)">
    <path d="M0,0 L260,-25 L300,-12 L260,4 L140,10 L50,42 L15,36 L38,6 Z" fill="#F2F5F7" stroke="#C7D0D4" stroke-width="2"/>
    <path d="M45,10 L65,-46 L88,-44 L78,10 Z" fill="#C7D0D4"/>
    <path d="M115,22 L92,60 L112,60 L136,24 Z" fill="#C7D0D4"/>
  </g>

  <!-- flags -->
  <g transform="translate(600,240)">
    <rect x="0" y="0" width="90" height="130" fill="#B22234"/>
    <rect x="0" y="0" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="20" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="40" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="60" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="80" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="100" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="120" width="90" height="10" fill="#FFFFFF"/>
    <rect x="0" y="0" width="40" height="65" fill="#3C3B6E"/>
    <text x="45" y="150" font-family="Arial" font-size="16" fill="#0E2A2D" text-anchor="middle">USA</text>
  </g>
  <g transform="translate(710,225)">
    <rect x="0" y="0" width="110" height="150" fill="#E30A17"/>
    <circle cx="45" cy="70" r="30" fill="#FFFFFF"/>
    <circle cx="55" cy="70" r="24" fill="#E30A17"/>
    <polygon points="80,70 100,63 92,78 100,90 80,80" fill="#FFFFFF"/>
    <text x="55" y="172" font-family="Arial" font-size="16" fill="#0E2A2D" text-anchor="middle">Turkey</text>
  </g>
  <g transform="translate(840,250)">
    <rect x="0" y="0" width="90" height="43" fill="#000000"/>
    <rect x="0" y="43" width="90" height="44" fill="#DD0000"/>
    <rect x="0" y="87" width="90" height="43" fill="#FFCE00"/>
    <text x="45" y="150" font-family="Arial" font-size="16" fill="#0E2A2D" text-anchor="middle">Germany</text>
  </g>

  <!-- shipping boxes -->
  <g transform="translate(940,290)">
    <rect x="0" y="0" width="70" height="55" fill="#D8B78A" stroke="#9C7A4E" stroke-width="2"/>
    <text x="35" y="33" font-family="Arial" font-size="12" fill="#5A3E1B" text-anchor="middle">trendyol</text>
    <rect x="80" y="10" width="70" height="55" fill="#D8B78A" stroke="#9C7A4E" stroke-width="2"/>
    <text x="115" y="43" font-family="Arial" font-size="11" fill="#5A3E1B" text-anchor="middle">hepsiburada</text>
    <rect x="0" y="65" width="70" height="55" fill="#D8B78A" stroke="#9C7A4E" stroke-width="2"/>
    <text x="35" y="98" font-family="Arial" font-size="12" fill="#5A3E1B" text-anchor="middle">zalando</text>
    <rect x="80" y="70" width="70" height="55" fill="#D8B78A" stroke="#9C7A4E" stroke-width="2"/>
    <text x="115" y="103" font-family="Arial" font-size="14" fill="#5A3E1B" text-anchor="middle">asos</text>
  </g>
</svg>
