<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
  </head>
  <body>
    <div class="general_container">
      <div class="screen">0</div>
      <div class="operation_num_container">
        <button class="btn_action" id="clear">C</button>
        <button class="btn_action" id="delete">DEL</button>
        <button class="operation">÷</button>

        <button class="btn_num">7</button>
        <button class="btn_num">8</button>
        <button class="btn_num">9</button>
        <button class="operation" id="multiplication">×</button>

        <button class="btn_num">4</button>
        <button class="btn_num">5</button>
        <button class="btn_num">6</button>
        <button class="operation" id="subtraction">-</button>

        <button class="btn_num">1</button>
        <button class="btn_num">2</button>
        <button class="btn_num">3</button>
        <button class="operation" id="addition">+</button>

        <button class="btn_num">0</button>
        <button class="btn_num" id="point">,</button>
        <button class="operation" id="equal">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
